<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="500" viewBox="0 0 900 500"
     xmlns="http://www.w3.org/2000/svg"
     font-family="Arial" font-size="11">

  <!-- =================  PANEL 1: datos sin colorear  ================= -->
  <g id="panel1">
    <rect x="0" y="0" width="220" height="220" fill="#fafafa" stroke="#ccc"/>
    <text x="110" y="20" text-anchor="middle" font-size="14" font-weight="bold">
      1) Puntos sin colorear
    </text>
    <!-- anillo exterior -->
    <g id="outerRing" fill="#555" r="4">
      <!-- generados con r=80±5 -->
      <circle cx="110" cy="110" r="4"/>
      <circle cx="150" cy="90"  r="4"/>
      <circle cx="185" cy="110" r="4"/>
      <circle cx="150" cy="150" r="4"/>
      <circle cx="120" cy="170" r="4"/>
      <circle cx="180" cy="170" r="4"/>
      <circle cx="200" cy="130" r="4"/>
      <circle cx="100" cy="130" r="4"/>
      <circle cx="160" cy="70"  r="4"/>
      <circle cx="135" cy="190" r="4"/>
    </g>
    <!-- anillo interior -->
    <g id="innerRing" fill="#555" r="4">
      <circle cx="110" cy="110" r="4"/>
      <circle cx="125" cy="100" r="4"/>
      <circle cx="140" cy="110" r="4"/>
      <circle cx="125" cy="125" r="4"/>
      <circle cx="110" cy="140" r="4"/>
      <circle cx="95"  cy="125" r="4"/>
      <circle cx="95"  cy="100" r="4"/>
    </g>
    <!-- algo de ruido esparcido -->
    <circle cx="50" cy="50" r="4" fill="#555"/>
    <circle cx="180" cy="30" r="4" fill="#555"/>
    <circle cx="30" cy="180" r="4" fill="#555"/>
  </g>

  <!-- =================  PANEL 2: ε y vecindad  ================= -->
  <g id="panel2" transform="translate(230,0)">
    <rect x="0" y="0" width="220" height="220" fill="#fafafa" stroke="#ccc"/>
    <text x="110" y="20" text-anchor="middle" font-size="14" font-weight="bold">
      2) ε = 25  (minPts = 4)
    </text>
    <!-- copiamos los puntos y los dejamos grises -->
    <use href="#outerRing" x="0" y="0"/>
    <use href="#innerRing" x="0" y="0"/>
    <circle cx="50" cy="50" r="4" fill="#555"/>
    <circle cx="180" cy="30" r="4" fill="#555"/>
    <circle cx="30" cy="180" r="4" fill="#555"/>

    <!-- dos ε de ejemplo -->
    <circle cx="150" cy="90" r="25" fill="none" stroke="#3498db" stroke-width="1.5"/>
    <circle cx="125" cy="100" r="25" fill="none" stroke="#e67e22" stroke-width="1.5"/>
    <text x="150" y="65" text-anchor="middle" font-size="9" fill="#3498db">ε</text>
    <text x="125" y="75" text-anchor="middle" font-size="9" fill="#e67e22">ε</text>
  </g>

  <!-- =================  PANEL 3: resultado DBSCAN  ================= -->
  <g id="panel3" transform="translate(460,0)">
    <rect x="0" y="0" width="220" height="220" fill="#fafafa" stroke="#ccc"/>
    <text x="110" y="20" text-anchor="middle" font-size="14" font-weight="bold">
      3) Dos clusters + ruido
    </text>

    <!-- Cluster 1 (anillo exterior) -->
    <g fill="#3498db" stroke="#2980b9" stroke-width="1.2">
      <circle cx="110" cy="110" r="4"/>
      <circle cx="150" cy="90"  r="4"/>
      <circle cx="185" cy="110" r="4"/>
      <circle cx="150" cy="150" r="4"/>
      <circle cx="120" cy="170" r="4"/>
      <circle cx="180" cy="170" r="4"/>
      <circle cx="200" cy="130" r="4"/>
      <circle cx="100" cy="130" r="4"/>
      <circle cx="160" cy="70"  r="4"/>
      <circle cx="135" cy="190" r="4"/>
    </g>

    <!-- Cluster 2 (anillo interior) -->
    <g fill="#e67e22" stroke="#d35400" stroke-width="1.2">
      <circle cx="110" cy="110" r="4"/>
      <circle cx="125" cy="100" r="4"/>
      <circle cx="140" cy="110" r="4"/>
      <circle cx="125" cy="125" r="4"/>
      <circle cx="110" cy="140" r="4"/>
      <circle cx="95"  cy="125" r="4"/>
      <circle cx="95"  cy="100" r="4"/>
    </g>

    <!-- Ruido -->
    <g fill="#e74c3c" stroke="#c0392b" stroke-width="1.2">
      <circle cx="50" cy="50" r="4"/>
      <circle cx="180" cy="30" r="4"/>
      <circle cx="30" cy="180" r="4"/>
    </g>
  </g>

  <!-- =================  PANEL 4: leyenda  ================= -->
  <g id="leyenda" transform="translate(690,0)">
    <rect x="0" y="0" width="200" height="220" fill="#fafafa" stroke="#ccc"/>
    <text x="100" y="20" text-anchor="middle" font-size="14" font-weight="bold">
      Leyenda
    </text>

    <g font-size="12">
      <!-- Núcleo -->
      <circle cx="20" cy="45" r="6" fill="#3498db" stroke="#2980b9" stroke-width="1.2"/>
      <text x="35" y="50">Punto núcleo</text>

      <!-- Frontera (usamos uno del interior) -->
      <circle cx="20" cy="70" r="6" fill="#e67e22" stroke="#d35400" stroke-width="1.2"/>
      <text x="35" y="75">Punto frontera</text>

      <!-- Ruido -->
      <circle cx="20" cy="95" r="6" fill="#e74c3c" stroke="#c0392b" stroke-width="1.2"/>
      <text x="35" y="100">Punto ruido</text>

      <!-- ε -->
      <circle cx="20" cy="125" r="12" fill="none" stroke="#7f8c8d" stroke-width="1.5"/>
      <text x="35" y="130">ε (epsilon)</text>

      <!-- minPts -->
      <text x="20" y="155" font-weight="bold">minPts = 4</text>
      <text x="20" y="170">(mín. vecinos dentro de ε)</text>

      <!-- colores clusters -->
      <rect x="20" y="185" width="12" height="12" fill="#3498db"/>
      <text x="35" y="195">Cluster 1</text>

      <rect x="20" y="200" width="12" height="12" fill="#e67e22"/>
      <text x="35" y="210">Cluster 2</text>
    </g>
  </g>

  <!-- flecha decorativa -->
  <defs>
    <marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#333"/>
    </marker>
  </defs>

  <!-- conector entre paneles -->
  <g stroke="#333" stroke-width="1" marker-end="url(#flecha)">
    <line x1="220" y1="110" x2="230" y2="110"/>
    <line x1="450" y1="110" x2="460" y2="110"/>
  </g>
</svg>