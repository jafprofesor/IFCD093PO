<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400"
     xmlns="http://www.w3.org/2000/svg"
     font-family="Arial, sans-serif" font-size="12">

  <!-- Fondo -->
  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Título -->
  <text x="300" y="25" text-anchor="middle" font-size="18" font-weight="bold">
    DBSCAN – ε = 25 px, minPoints = 4
  </text>

  <!-- Leyenda -->
  <g transform="translate(20,50)">
    <circle cx="8" cy="8" r="6" fill="#2ecc71"/>
    <text x="18" y="12">Núcleo</text>

    <circle cx="8" cy="26" r="6" fill="#f1c40f"/>
    <text x="18" y="30">Frontera</text>

    <circle cx="8" cy="44" r="6" fill="#e74c3c"/>
    <text x="18" y="48">Ruido</text>

    <text x="0" y="68" font-style="italic">Círculo gris = ε</text>
  </g>

  <!-- PUNTOS NÚCLEO -->
  <!-- Verde -->
  <g fill="#2ecc71" stroke="#27ae60" stroke-width="1.5">
    <circle cx="150" cy="140" r="6"/>
    <circle cx="190" cy="160" r="6"/>
    <circle cx="170" cy="110" r="6"/>
    <circle cx="210" cy="130" r="6"/>
    <circle cx="400" cy="200" r="6"/>
    <circle cx="430" cy="180" r="6"/>
    <circle cx="450" cy="220" r="6"/>
    <circle cx="420" cy="240" r="6"/>
  </g>

  <!-- PUNTOS FRONTERA -->
  <!-- Amarillo -->
  <g fill="#f1c40f" stroke="#d4ac0d" stroke-width="1.5">
    <circle cx="130" cy="130" r="6"/>
    <circle cx="230" cy="150" r="6"/>
  </g>

  <!-- PUNTOS RUIDO -->
  <!-- Rojo -->
  <g fill="#e74c3c" stroke="#c0392b" stroke-width="1.5">
    <circle cx="80"  cy="100" r="6"/>
    <circle cx="520" cy="120" r="6"/>
    <circle cx="350" cy="300" r="6"/>
  </g>

  <!-- CÍRCULOS ε alrededor de un núcleo de ejemplo -->
  <g stroke="#95a5a6" stroke-width="1.5" fill="none">
    <!-- Núcleo ejemplo (170,110) -->
    <circle cx="170" cy="110" r="25"/>
    <!-- Otro núcleo ejemplo (400,200) -->
    <circle cx="400" cy="200" r="25"/>
  </g>

  <!-- Etiquetas -->
  <text x="170" y="95" text-anchor="middle" font-size="10" fill="#555">
    ε = 25
  </text>
  <text x="400" y="185" text-anchor="middle" font-size="10" fill="#555">
    ε = 25
  </text>

  <!-- Flechas y anotaciones -->
  <g stroke="#333" stroke-width="1" marker-end="url(#arrow)">
    <line x1="200" y1="70" x2="170" y2="95"/>
    <text x="205" y="65" font-size="10">Radio ε</text>

    <line x1="130" y1="115" x2="145" y2="128"/>
    <text x="100" y="110" font-size="10">Frontera</text>

    <line x1="80"  y1="85" x2="80"  y2="95"/>
    <text x="50" y="80" font-size="10">Ruido</text>
  </g>

  <!-- Definición del marcador de flecha -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6"
            refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#333"/>
    </marker>
  </defs>
</svg>